<!doctype html>
<html data-theme="{{THEME}}" data-private="{{PRIVATE}}">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
/*THEME*/
html, body { height: 100%; background: var(--page); }
body { display: flex; }
nav { width: 248px; flex: none; padding: 22px 12px; border-right: 1px solid var(--border); overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 18px; font-weight: 650; font-size: 15px; }
.brand svg { width: 30px; height: 30px; }
.brand small { display: block; color: var(--muted); font-weight: 400; font-size: 11.5px; }
nav button { display: flex; align-items: center; gap: 12px; width: 100%; height: 38px; padding: 0 12px; border: 0; border-radius: 9px; background: none; color: var(--muted); text-align: left; font-size: 13.5px; }
nav button:hover { background: var(--hover); color: var(--text); }
nav button.on { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent-2); font-weight: 600; }
main { flex: 1; overflow-y: auto; padding: 30px 40px 60px; }
.wrap { max-width: 880px; margin: 0 auto; }
h1 { font: 600 26px "Segoe UI Variable Display", "Segoe UI", sans-serif; margin-bottom: 18px; }
h2 { font-size: 16px; margin: 26px 0 10px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 4px 0; margin-bottom: 14px; }
.card.p { padding: 16px 18px; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.b { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border: 1px solid var(--border); border-radius: 9px; background: var(--card); font-weight: 600; white-space: nowrap; }
.b:hover { background: var(--tab-hover); }
.b.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.b.danger { color: var(--danger); }
.b.sm { height: 28px; padding: 0 10px; font-weight: 500; }
input.t, select { height: 34px; padding: 0 12px; border: 1.5px solid var(--border); border-radius: 9px; background: var(--field); color: var(--text); font: inherit; outline: 0; min-width: 0; }
input.t:focus, select:focus { border-color: var(--accent); }
input.grow { flex: 1; }
.row { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 16px; border-bottom: 1px solid var(--border); }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--hover); }
.row .main { flex: 1; min-width: 0; }
.row .ttl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .time { color: var(--muted); font-size: 12px; width: 58px; flex: none; }
.row a { color: var(--text); text-decoration: none; cursor: pointer; }
.row a:hover { color: var(--accent-2); text-decoration: underline; }
.ib { width: 30px; height: 30px; display: grid; place-items: center; border: 0; border-radius: 8px; background: none; color: var(--muted); flex: none; }
.ib:hover { background: var(--hover); color: var(--text); }
.ltr { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-weight: 700; flex: none; }
.day { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin: 18px 4px 8px; }
.empty { padding: 40px; text-align: center; color: var(--muted); }
.note { color: var(--muted); line-height: 1.55; }
.set { display: flex; align-items: center; gap: 16px; padding: 12px 18px; border-bottom: 1px solid var(--border); }
.set:last-child { border-bottom: 0; }
.set .main b { display: block; font-weight: 600; margin-bottom: 2px; }
.set .main span { color: var(--muted); font-size: 12.5px; }
.sw { position: relative; width: 40px; height: 22px; flex: none; border-radius: 11px; background: var(--border); border: 0; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
.sw.on { background: var(--accent); } .sw.on::after { left: 21px; }
.pw { font-family: Consolas, monospace; letter-spacing: 1px; }
.badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent-2); }
.themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.theme { border: 2px solid var(--border); border-radius: 12px; padding: 0; overflow: hidden; background: none; text-align: left; }
.theme.on { border-color: var(--accent); }
.theme .pv { height: 70px; display: flex; flex-direction: column; }
.theme .nm { padding: 9px 12px; font-weight: 600; }
table { width: 100%; border-collapse: collapse; }
td { padding: 9px 16px; border-bottom: 1px solid var(--border); }
td:first-child { width: 42%; }
kbd { display: inline-block; padding: 2px 7px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 6px; background: var(--field); font: 12px Consolas, monospace; }
#toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); padding: 11px 18px; border-radius: 10px;
  background: var(--text); color: var(--page); font-weight: 600; opacity: 0; transition: .2s; pointer-events: none; }
#toast.on { opacity: 1; transform: translateX(-50%); }
.about { display: flex; gap: 20px; align-items: center; }
.about svg { width: 80px; height: 80px; flex: none; }
</style>
</head>
<body>
<nav id="nav"><div class="brand">{{LOGO}}<div>Veil<small>By Claude, Built in Rust.</small></div></div></nav>
<main><div class="wrap" id="main"></div></main>
<div id="toast"></div>
<script>
/*ICONS*/
const PAGE = "{{PAGE}}";
/*PAGES_JS*/
</script>
</body>
</html>
